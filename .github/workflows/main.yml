# The fork's CI. Upstream records to Cypress Cloud in five parallel containers;
# this fork has no record key, so the end-to-end tests run in one container,
# unrecorded, in Chrome.
name: Cypress Tests

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
      - run: yarn types
      - run: yarn lint
      - run: yarn test:unit:ci
      - run: yarn build:ci

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: build

  ui-chrome-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - run: yarn install --frozen-lockfile

      # The action's own start and wait-on stop at the first refused
      # connection under Node 24, so the servers start here and
      # precypress:run waits for them with the wait-on package.
      - name: "UI Tests - Chrome"
        run: |
          yarn start:ci > server.log 2>&1 &
          yarn cypress:run --browser chrome

      - name: Server log
        if: failure()
        run: cat server.log
