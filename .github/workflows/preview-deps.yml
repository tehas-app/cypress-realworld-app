# The preview's dependency image (preview/deps.Dockerfile). A tehas preview
# builds with no network, so preview/Dockerfile starts FROM
# ghcr.io/tehas-app/cypress-realworld-app-deps:<tag>, where <tag> is
# preview/deps-tag.sh's digest of what decides node_modules. This checks the
# recipe names that tag, and publishes the image when the tag is new. Own
# branches run on the org's runners, a fork's pull request on GitHub's.
name: Preview dependencies

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deps:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "tehas"]') || 'ubuntu-latest' }}
    env:
      IMAGE: ghcr.io/tehas-app/cypress-realworld-app-deps
    steps:
      - uses: actions/checkout@v4

      - name: The recipe names this commit's tag
        run: |
          tag=$(sh preview/deps-tag.sh)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if ! grep -qx "FROM $IMAGE:$tag" preview/Dockerfile; then
            echo "::error file=preview/Dockerfile::FROM must be $IMAGE:$tag (sh preview/deps-tag.sh); the dependencies changed"
            exit 1
          fi

      - name: Publish the image when the tag is new
        # A pull request from a fork cannot write packages; its preview is
        # never built either.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$TAG is there"
            exit 0
          fi
          docker build -f preview/deps.Dockerfile -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
